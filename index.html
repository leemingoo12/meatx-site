<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Meat X | 글로벌 축산물 트레이딩 & 컨설팅</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF5C00;
      --primary-dark: #E65300;
      --secondary: #1A202C;
      --text-main: #2D3748;
      --text-muted: #718096;
      --bg-light: #F7FAFC;
      --white: #FFFFFF;
      --border: #E2E8F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { 
      font-family: 'Pretendard', sans-serif; 
      background-color: var(--white); 
      color: var(--text-main); 
      line-height: 1.6;
      word-break: keep-all; /* 단어 단위 줄바꿈 */
    }

    .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 20px; }

    /* Navigation */
    nav {
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 22px; font-weight: 800; color: var(--secondary); letter-spacing: -0.5px; }
    .logo span { color: var(--primary); }
    .nav-links a { text-decoration: none; color: var(--text-main); margin-left: 20px; font-weight: 600; font-size: 14px; }

    /* Hero Section */
    .hero { padding: 60px 0; text-align: center; background: linear-gradient(180deg, #fff 0%, var(--bg-light) 100%); }
    .badge { 
      display: inline-block; padding: 4px 12px; background: rgba(255, 92, 0, 0.1); 
      color: var(--primary); border-radius: 50px; font-weight: 700; font-size: 12px; margin-bottom: 16px;
    }
    h1 { font-size: 28px; font-weight: 800; line-height: 1.3; color: var(--secondary); margin-bottom: 16px; letter-spacing: -0.5px; }
    .hero p { font-size: 16px; color: var(--text-muted); max-width: 600px; margin: 0 auto 32px; padding: 0 10px; }

    /* Buttons */
    .btn-group { display: flex; flex-direction: column; gap: 10px; padding: 0 10px; }
    .btn { 
      width: 100%; padding: 16px; border-radius: 12px; font-weight: 600; cursor: pointer; 
      transition: all 0.2s; border: none; font-size: 16px; text-decoration: none; text-align: center;
    }
    .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(255, 92, 0, 0.2); }
    .btn-outline { background: white; color: var(--secondary); border: 1px solid var(--border); }

    /* KPI Section */
    .kpis { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 40px; }
    .kpi-item { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: left; }
    .kpi-num { display: block; font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .kpi-label { font-size: 14px; color: var(--text-muted); font-weight: 500; }

    /* Sections */
    .section { padding: 50px 0; }
    .section-title { font-size: 24px; font-weight: 700; margin-bottom: 30px; text-align: center; color: var(--secondary); }
    
    /* Grid */
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .card { 
      background: white; padding: 24px; border-radius: 16px; border: 1px solid var(--border);
    }
    .card h3 { font-size: 18px; margin-bottom: 16px; color: var(--secondary); }
    
    .list { list-style: none; }
    .list li { margin-bottom: 10px; display: flex; align-items: flex-start; color: var(--text-main); font-size: 15px; }
    .list li::before { content: "✓"; color: var(--primary); font-weight: bold; margin-right: 10px; flex-shrink: 0; }

    /* Triple Cards */
    .triple-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .feature-card { text-align: center; padding: 30px 20px; background: var(--bg-light); border-radius: 16px; }
    .feature-card h3 { font-size: 18px; margin-bottom: 10px; color: var(--secondary); }
    .feature-card p { font-size: 14px; }

    /* Footer */
    footer { padding: 40px 0; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 13px; }
    .footer-content { display: flex; flex-direction: column; gap: 20px; text-align: center; }
