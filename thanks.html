<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의 접수 완료 | Meat X</title> 
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Pretendard', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #F7FAFC; color: #1A202C; text-align: center; }
    .card { background: white; padding: 50px 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #E2E8F0; max-width: 400px; width: 90%; }
    .icon { font-size: 50px; color: #FF5C00; margin-bottom: 20px; }
    h1 { font-size: 24px; margin-bottom: 16px; }
    p { color: #718096; margin-bottom: 30px; line-height: 1.6; }
    .btn { display: inline-block; padding: 14px 28px; background: #1A202C; color: white; text-decoration: none; border-radius: 12px; font-weight: 600; transition: 0.3s; }
    .btn:hover { background: #2D3748; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>문의가 접수되었습니다</h1>
    <p>보내주신 소중한 문의 내용을 확인하였습니다.<br>담당자가 검토 후 빠른 시일 내에<br>기재하신 이메일로 답변드리겠습니다.</p>
    <a href="index.html" class="btn">홈으로 돌아가기</a>
  </div>
</body>
</html>
